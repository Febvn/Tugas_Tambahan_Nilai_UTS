<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello {{ name }}</title>
    <link rel="stylesheet" href="{{ request.static_url('tutorial:static/app.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hello {{ name }}!</h1>
            <p>Personalized greeting page with logging</p>
        </header>

        <main>
            <div class="greeting-card">
                <h2>{{ greeting }}</h2>
                <p>This request has been logged with your information.</p>
            </div>

            <div class="demo-section">
                <h2>Test POST Request (Logged)</h2>
                <form id="hello-form" class="form-section">
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <input type="text" id="message" name="message" placeholder="Enter a message" required>
                    </div>
                    <button type="submit" class="btn">Send POST Request</button>
                </form>
                <div id="post-response" class="response-area"></div>
            </div>

            <div class="demo-section">
                <h2>Navigation</h2>
                <p><a href="/" class="btn">Back to Home</a></p>
            </div>
        </main>
    </div>

    <script src="{{ request.static_url('tutorial:static/app.js') }}"></script>
    <script>
        document.getElementById('hello-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = document.getElementById('message').value;
            const responseDiv = document.getElementById('post-response');

            try {
                const response = await fetch(window.location.pathname, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message, timestamp: new Date().toISOString() })
                });

                const data = await response.json();
                responseDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                responseDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
