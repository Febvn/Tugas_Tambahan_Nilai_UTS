<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="pyramid web application">
    <meta name="author" content="Pylons Project">
    <link rel="shortcut icon" href="{{ request.static_url('tutorial:static/favicon.ico') }}">
    <title>Wiki - Edit {{ page.name }}</title>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ request.static_url('tutorial:static/app.css') }}" rel="stylesheet">
</head>
<body>
    <div class="starter-template">
        <div class="container">
            <div class="row">
                <div class="col-md-2">
                    <img class="logo img-responsive" src="{{ request.static_url('tutorial:static/pyramid-201x150.png') }}">
                </div>
                <div class="col-md-10">
                    <div class="content">
                        <h1><span class="glyphicon glyphicon-book"></span> Wiki</h1>
                        <p class="lead">Editing <strong>{{ page.name }}</strong></p>
                        <p><a href="{{ request.route_url('home') }}" class="btn btn-default">Home</a>
                        <a href="{{ request.route_url('page', pagename=page.name) }}" class="btn btn-info">View</a></p>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <form action="{{ save_url }}" method="post">
                        <div class="form-group">
                            <label for="body">Content</label>
                            <textarea name="body" class="form-control" rows="10">{{ page.data }}</textarea>
                        </div>
                        <div class="form-group">
                            <button type="submit" name="form.submitted" value="Save" class="btn btn-default">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="//code.jquery.com/jquery-1.11.0.min.js"></script>
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js"></script>
</body>
</html>
