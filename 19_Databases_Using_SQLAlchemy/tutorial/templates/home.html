<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="pyramid web application">
    <meta name="author" content="Pylons Project">
    <link rel="shortcut icon" href="{{ request.static_url('tutorial:static/favicon.ico') }}">
    <title>Wiki - Home</title>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ request.static_url('tutorial:static/app.css') }}" rel="stylesheet">
</head>
<body>
    <div class="starter-template">
        <div class="container">
            <div class="row">
                <div class="col-md-2">
                    <img class="logo img-responsive" src="{{ request.static_url('tutorial:static/pyramid-201x150.png') }}">
                </div>
                <div class="col-md-10">
                    <div class="content">
                        <h1><span class="glyphicon glyphicon-book"></span> Wiki</h1>
                        <p class="lead">Welcome to the Wiki application.</p>
                        <p>Visit <code><a href="{{ request.route_url('page', pagename='FrontPage') }}">FrontPage</a></code></p>
                        <p><a href="{{ request.route_url('page', pagename='FrontPage') }}" class="btn btn-success">View Wiki</a></p>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <h3>Existing Pages</h3>
                    <ul>
                    {% for page in pages %}
                        <li><a href="{{ request.route_url('page', pagename=page.name) }}">{{ page.name }}</a></li>
                    {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="//code.jquery.com/jquery-1.11.0.min.js"></script>
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js"></script>
</body>
</html>
